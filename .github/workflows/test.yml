name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Portable CLI smoke test (no credentials or network)
        run: python3 eval/platform_smoke.py target/debug/sessionkit
      - run: cargo test --locked --features test-api
      - run: cargo build --locked --features test-api
      - name: Decision provider HTTP contracts (local fake server)
        run: python3 eval/decision_smoke.py target/debug/sessionkit

  survey-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s eval/surveyor -p 'test_*.py' -v
